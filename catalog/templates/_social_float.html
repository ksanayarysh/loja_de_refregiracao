{# Botão flutuante do Instagram, logo acima do botão do WhatsApp (.wa-float) em todas as páginas #}
<style>
  .ig-float{position:fixed;z-index:200;width:52px;height:52px;border-radius:50%;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);
    box-shadow:0 4px 18px rgba(214,36,159,.35);transition:transform .15s;text-decoration:none;}
  .ig-float:hover{transform:translateY(-2px);}
  .ig-float svg{width:26px;height:26px;}
  /* WhatsApp flutuante: só o ícone (sem o texto "Falar no WhatsApp") em todas as telas, para não cobrir o conteúdo */
  html body .wa-float{padding:14px !important;border-radius:50% !important;gap:0 !important;}
  html body .wa-float span{display:none !important;}
  html body .wa-float svg{width:24px !important;height:24px !important;}
</style>
<script>
(function () {
  function init() {
    if (document.querySelector('.ig-float')) return;
    var ig = document.createElement('a');
    ig.className = 'ig-float';
    ig.href = 'https://www.instagram.com/mtf_refrigeracao/';
    ig.target = '_blank'; ig.rel = 'noopener';
    ig.setAttribute('aria-label', 'Instagram da MTF Refrigeração');
    ig.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="#fff" stroke="none"/></svg>';
    document.body.appendChild(ig);
    function place() {
      var wa = document.querySelector('.wa-float');
      if (!wa || getComputedStyle(wa).display === 'none') { ig.style.display = 'none'; return; }
      ig.style.display = 'flex';
      // Usa o bottom/right do CSS do WhatsApp (não a altura da tela): no celular a barra do navegador
      // some/aparece ao rolar e clientHeight não acompanha, por isso o Instagram pulava para baixo.
      var cs = getComputedStyle(wa);
      var b = parseFloat(cs.bottom) || 16, rt = parseFloat(cs.right) || 16;
      var w = wa.offsetWidth || 52, h = wa.offsetHeight || 52;
      ig.style.right = Math.max(4, rt + (w - 52) / 2) + 'px';   // centralizado sobre o WhatsApp
      ig.style.bottom = (b + h + 12) + 'px';
    }
    place();
    window.addEventListener('resize', place);
    window.addEventListener('orientationchange', place);
    new MutationObserver(place).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    setTimeout(place, 600); setTimeout(place, 2000);   // depois de fontes/barra do carrinho
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<style>
  .tel-pop{position:fixed;z-index:300;left:50%;bottom:28px;transform:translateX(-50%);background:#0b1a3a;color:#fff;border-radius:14px;
    padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.35);font:600 15px/1.4 system-ui,sans-serif;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw}
  .tel-pop b{font-size:18px;letter-spacing:.02em}
  .tel-pop a{background:#25d366;color:#06301a;border-radius:999px;padding:7px 14px;text-decoration:none;font-weight:800;font-size:14px}
  .tel-pop button{background:none;border:0;color:#9fb2d3;font-size:20px;cursor:pointer;line-height:1}
</style>
<script>
/* No computador "tel:" não liga (abre nada ou um seletor de app): mostra o número, copia e oferece o WhatsApp */
(function () {
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches;
  if (touch) return;
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="tel:"]');
    if (!a) return;
    e.preventDefault();
    var num = a.getAttribute('href').slice(4).replace(/[^\d+]/g, '');
    var d = num.replace(/^\+?55/, '');
    var fmt = d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : num;
    try { navigator.clipboard && navigator.clipboard.writeText(fmt); } catch (er) {}
    var old = document.querySelector('.tel-pop'); if (old) old.remove();
    var p = document.createElement('div'); p.className = 'tel-pop';
    p.innerHTML = '📞 <span>Ligue: <b>' + fmt + '</b> <small style="opacity:.7">(copiado)</small></span>' +
      '<a href="https://wa.me/' + num.replace('+', '') + '" target="_blank" rel="noopener">Chamar no WhatsApp</a>' +
      '<button type="button" aria-label="Fechar">×</button>';
    p.querySelector('button').onclick = function () { p.remove(); };
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, 12000);
  });
})();
</script>
