<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M.T.F Refrigeração — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #f8f7f4;
      --surface:  #ffffff;
      --border:   #e8e5df;
      --text:     #1a1816;
      --muted:    #8a8580;
      --accent:   #e2144a;
      --accent-l: #fdf0f3;
      --green:    #16a34a;
      --green-l:  #f0fdf4;
      --wa:       #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 900px; margin: 0 auto;
      padding: 0 20px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .logo-mark {
      width: 34px; height: 34px; background: var(--accent);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-weight: 500; color: #fff; font-size: .85rem;
    }
    .logo-text {
      font-weight: 700; font-size: 1rem; color: var(--text); line-height: 1.1;
    }
    .logo-sub {
      font-size: .72rem; color: var(--muted); font-weight: 400; letter-spacing: .04em;
    }
    .wa-btn-header {
      display: flex; align-items: center; gap: 7px;
      background: var(--wa); color: #fff;
      padding: 8px 14px; border-radius: 8px;
      font-weight: 700; font-size: .85rem; text-decoration: none;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .wa-btn-header:hover { opacity: .88; }
    .wa-btn-header svg { flex-shrink: 0; }

    /* ── HERO ── */
    .hero {
      max-width: 900px; margin: 0 auto;
      padding: 48px 20px 32px;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700; line-height: 1.2;
      letter-spacing: -.02em;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      color: var(--muted); margin-top: 8px;
      font-size: 1rem; font-weight: 400;
    }

    /* ── SEARCH + FILTERS ── */
    .controls {
      max-width: 900px; margin: 0 auto;
      padding: 0 20px 20px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .search-wrap {
      flex: 1; min-width: 200px; position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    .search-wrap input {
      width: 100%; padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--surface); font-family: inherit; font-size: .95rem;
      color: var(--text); transition: border-color .15s;
    }
    .search-wrap input:focus { outline: none; border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }

    .filter-row {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .filter-chip {
      padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-family: inherit; font-size: .82rem; font-weight: 500;
      color: var(--muted); cursor: pointer; transition: all .15s;
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; font-weight: 700;
    }

    /* ── STATS BAR ── */
    .stats-bar {
      max-width: 900px; margin: 0 auto;
      padding: 0 20px 16px;
      font-size: .82rem; color: var(--muted);
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    .stats-bar b { color: var(--text); }
    .dot-green { color: var(--green); font-weight: 700; }
    .dot-red   { color: #dc2626; font-weight: 700; }

    /* ── CATALOG ── */
    .catalog {
      max-width: 900px; margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* Category group */
    .cat-group { margin-bottom: 32px; }
    .cat-title {
      font-size: .7rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
      display: flex; align-items: center; gap: 8px;
    }
    .cat-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Product row */
    .product-row {
      display: flex; align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      transition: background .1s;
    }
    .product-row:last-child { border-bottom: none; }
    .product-row:hover { background: rgba(0,0,0,.015); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }

    .prod-name {
      flex: 1; font-weight: 500; font-size: .97rem; color: var(--text);
    }
    .prod-name.out { color: var(--muted); }

    .stock-pill {
      font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 10px;
      flex-shrink: 0; white-space: nowrap;
    }
    .stock-pill.in  { background: var(--green-l); color: var(--green); }
    .stock-pill.out { background: #fef2f2; color: #dc2626; }

    .prod-price {
      font-family: 'DM Mono', monospace;
      font-size: .95rem; font-weight: 500;
      color: var(--text); flex-shrink: 0;
      min-width: 80px; text-align: right;
    }
    .prod-price.no-price { color: var(--muted); font-size: .82rem; font-family: 'DM Sans', sans-serif; }

    .wa-row-btn {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--green-l); color: var(--green);
      text-decoration: none; transition: all .15s;
    }
    .wa-row-btn:hover { background: var(--wa); color: #fff; }

    /* empty state */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; }

    /* ── LOADING ── */
    .loading {
      text-align: center; padding: 80px 20px;
      color: var(--muted); font-size: .95rem;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FLOATING WA BUTTON ── */
    .wa-float {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      display: flex; align-items: center; gap: 8px;
      background: var(--wa); color: #fff;
      padding: 12px 20px; border-radius: 50px;
      text-decoration: none; font-weight: 700; font-size: .92rem;
      box-shadow: 0 4px 20px rgba(37,211,102,.35);
      transition: transform .2s, box-shadow .2s;
    }
    .wa-float:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37,211,102,.45);
    }
    .wa-float svg { flex-shrink: 0; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 20px; text-align: center;
      font-size: .8rem; color: var(--muted);
    }

    @media (max-width: 480px) {
      .hero { padding: 28px 16px 20px; }
      .controls { padding: 0 16px 16px; }
      .stats-bar { padding: 0 16px 12px; }
      .catalog { padding: 0 16px 80px; }
      .wa-float span { display: none; }
      .wa-float { padding: 14px; border-radius: 50%; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-mark">MTF</div>
      <div>
        <div class="logo-text">M.T.F Refrigeração</div>
        <div class="logo-sub">Peças e componentes</div>
      </div>
    </a>
    <a class="wa-btn-header" id="waHeaderBtn" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.853L.057 23.854a.5.5 0 0 0 .609.61l6.084-1.506A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a10 10 0 0 1-5.195-1.452l-.372-.22-3.862.955.984-3.78-.243-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
      </svg>
      WhatsApp
    </a>
  </div>
</header>

<div class="hero">
  <h1>Catálogo de <span>Peças</span></h1>
  <p>Componentes para refrigeração · Consulte disponibilidade e preços</p>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar produto...">
  </div>
  <div class="filter-row" id="filterRow">
    <button class="filter-chip active" data-filter="all">Todos</button>
    <!-- category chips inserted by JS -->
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="spinner" style="width:18px;height:18px;margin:0;border-width:2px;"></div>
  <span>Carregando...</span>
</div>

<div class="catalog" id="catalog">
  <div class="loading">
    <div class="spinner"></div>
    Buscando produtos...
  </div>
</div>

<!-- Floating WhatsApp button -->
<a class="wa-float" id="waFloatBtn" href="#" target="_blank" rel="noopener">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.853L.057 23.854a.5.5 0 0 0 .609.61l6.084-1.506A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a10 10 0 0 1-5.195-1.452l-.372-.22-3.862.955.984-3.78-.243-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
  </svg>
  <span>Falar no WhatsApp</span>
</a>

<footer>
  <p>M.T.F Refrigeração · Peças e componentes para refrigeração</p>
</footer>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  const API_URL = "/api/catalog";
  const WA_NUMBER  = '+5521995568722'; // ex: 5521999998888
  const WA_MSG     = 'Olá! Gostaria de mais informações sobre os produtos.';
  // ────────────────────────────────────────────────────────

  let allProducts  = [];
  let activeFilter = 'all';
  let searchQuery  = '';

  function waLink(msg) {
    return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  }
  function waMsgForProduct(name, price) {
    const priceText = price ? ` (R$ ${price.toFixed(2)})` : '';
    return `Olá! Tenho interesse no produto: *${name}*${priceText}. Está disponível?`;
  }

  function setWaLinks() {
    const link = waLink(WA_MSG);
    document.getElementById('waHeaderBtn').href = link;
    document.getElementById('waFloatBtn').href  = link;
  }

  // ── RENDER ──
  function getFilteredProducts() {
    return allProducts.filter(p => {
      const matchSearch = !searchQuery
        || p.name.toLowerCase().includes(searchQuery)
        || p.category.toLowerCase().includes(searchQuery);
      const matchFilter = activeFilter === 'all'
        || activeFilter === p.category;
      return matchSearch && matchFilter;
    });
  }

  function renderStats(filtered) {
    const total   = filtered.length;
    const inStock = filtered.filter(p => p.in_stock).length;
    const out     = total - inStock;
    document.getElementById('statsBar').innerHTML =
      `<b>${total}</b> produtos disponíveis`;
  }

  function renderCatalog() {
    const filtered = getFilteredProducts();
    const catalog  = document.getElementById('catalog');

    renderStats(filtered);

    if (filtered.length === 0) {
      catalog.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Nenhum produto encontrado.</p></div>`;
      return;
    }

    // Group by category (preserving order)
    const groups = {};
    filtered.forEach(p => {
      if (!groups[p.category]) groups[p.category] = [];
      groups[p.category].push(p);
    });

    let html = '';
    for (const [cat, products] of Object.entries(groups)) {
      html += `<div class="cat-group">
        <div class="cat-title">${cat}</div>`;
      products.forEach(p => {
        const priceHtml = p.sale_price != null
          ? `<div class="prod-price">R$ ${p.sale_price.toFixed(2)}</div>`
          : `<div class="prod-price no-price">Consulte</div>`;
        const stockPill = `<span class="stock-pill in">Disponível</span>`;
        const waHref = waLink(waMsgForProduct(p.name, p.sale_price));
        html += `
        <div class="product-row">
          <div class="prod-name">${p.name}</div>
          ${stockPill}
          ${priceHtml}
          <a class="wa-row-btn" href="${waHref}" target="_blank" rel="noopener" title="Consultar no WhatsApp">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.853L.057 23.854a.5.5 0 0 0 .609.61l6.084-1.506A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a10 10 0 0 1-5.195-1.452l-.372-.22-3.862.955.984-3.78-.243-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
            </svg>
          </a>
        </div>`;
      });
      html += `</div>`;
    }
    catalog.innerHTML = html;
  }

  // ── CATEGORY FILTER CHIPS ──
  function buildCategoryChips() {
    const cats = [...new Set(allProducts.map(p => p.category))].sort();
    const row  = document.getElementById('filterRow');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className   = 'filter-chip';
      btn.dataset.filter = cat;
      btn.textContent = cat;
      row.appendChild(btn);
    });
  }

  // ── EVENTS ──
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderCatalog();
  });

  document.getElementById('filterRow').addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    activeFilter = chip.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderCatalog();
  });

  // ── LOAD DATA ──
  async function loadData() {
    try {
      const res  = await fetch(API_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allProducts = await res.json();
      buildCategoryChips();
      renderCatalog();
    } catch (err) {
      document.getElementById('catalog').innerHTML =
        `<div class="empty-state">
          <div class="icon">⚠️</div>
          <p>Não foi possível carregar o catálogo.<br>
          <small style="color:#aaa;font-size:.8rem;">${err.message}</small></p>
        </div>`;
      document.getElementById('statsBar').textContent = '';
    }
  }

  setWaLinks();
  loadData();
</script>
</body>
</html>
