<div class="address-bar">
  <a href="https://maps.google.com/?q=MTF+Refrigera%C3%A7%C3%A3o+Rio+de+Janeiro" target="_blank" rel="noopener">📍 {{ store_address }} · <span style="text-decoration:underline;opacity:.7;">Ver no mapa →</span></a>
  {% if store_phone %}
  <span>·</span>
  <a href="tel:+{{ wa_number }}" class="phone-track">📞 {{ store_phone }}</a>
  <span>·</span>
  <a href="https://wa.me/{{ wa_number }}" class="wa-track" data-product="Geral">💬 WhatsApp</a>
  {% endif %}
</div>

<header>
  <div class="header-top">
    <a class="logo" href="/">
      <div class="logo-mark">MTF</div>
      <div>
        <div class="logo-text">M.T.F Refrigeração</div>
        <div class="logo-sub">Peças · Gases · Serviços</div>
      </div>
    </a>
    <nav class="nav-links">
      <a href="/catalogo" {% if active_page == 'catalogo' %}class="active"{% endif %}>Catálogo completo</a>
      <a href="/servicos" {% if active_page == 'servicos' %}class="active"{% endif %}>Serviços</a>
      <a href="/blog" {% if active_page == 'blog' %}class="active"{% endif %}>Guias</a>
      <a href="/sobre" {% if active_page == 'sobre' %}class="active"{% endif %}>Sobre nós</a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="/ajuda" class="ajuda-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span>Precisa de ajuda?</span>
      </a>
      <button class="cart-btn" onclick="cartOpen()" aria-label="Carrinho">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <a class="wa-btn-header wa-track" href="https://wa.me/{{ wa_number }}?text=Ol%C3%A1%21%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es." target="_blank" rel="noopener" data-product="Geral">
