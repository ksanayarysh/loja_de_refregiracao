<script>
(function(){try{
  if (sessionStorage.getItem('mtf_src')) return;
  var q = new URLSearchParams(location.search), r = document.referrer || '', src = 'direto';
  if (q.get('gclid') || q.get('gbraid') || q.get('wbraid')) src = 'Google Ads';
  else if (q.get('utm_source')) src = q.get('utm_source') + (q.get('utm_medium') ? ' / ' + q.get('utm_medium') : '') + (q.get('utm_campaign') ? ' · ' + q.get('utm_campaign') : '');
  else if (q.get('fbclid')) src = /instagram/i.test(r) ? 'Instagram' : 'Facebook/Instagram';
  else if (r && r.indexOf(location.host) < 0) {
    var h = r.replace(/^https?:\/\//, '').split('/')[0];
    src = /google/.test(h) ? 'Google (busca)' : /instagram/.test(h) ? 'Instagram' : /facebook|fb\./.test(h) ? 'Facebook'
        : /whatsapp|wa\.me/.test(h) ? 'WhatsApp' : h;
  }
  sessionStorage.setItem('mtf_src', src.slice(0, 80));
}catch(e){}})();
function mtfSrc(){ try { return sessionStorage.getItem('mtf_src') || ''; } catch(e) { return ''; } }
</script>

<style>
  @font-face { font-family: 'DM Sans'; font-display: swap; }
  @font-face { font-family: 'DM Mono'; font-display: swap; }
  :root{
    /* paleta "refrigeração": azul-marinho + turquesa; rosa M.T.F só para promoções */
    --navy:#0b2545;          /* faixa do topo, títulos fortes */
    --accent:#0e7c99;        /* botões, links, preços, destaque */
    --accent-d:#0a5f75;      /* hover */
    --accent-l:#e6f4f8;      /* fundo claro (gelo) */
    --accent-b:#bfe3ee;      /* borda clara */
    --promo:#e2144a;         /* rosa M.T.F: promoção, desconto, contador do carrinho */
    --promo-l:#fff0f4;
    --bg:#f4f8fa;--surface:#fff;--border:#dde7ec;--text:#0f1e2e;--muted:#6b7c8a;
    --green:#16a34a;--green-l:#f0fdf4;--wa:#25d366;
  }
  /* promoções continuam rosa em todas as páginas */
  .promo-sticker,.promo-off,.promo-pill,.kit-save,.promo-badge{background:var(--promo)!important;color:#fff!important;}
  .promo-new,.promo-card .promo-new{color:var(--promo)!important;}
  .promo-add{background:var(--promo)!important;}
  .on-promo .prod-price,.prod-price.on-promo{color:var(--promo)!important;}
  *{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
  /* nada pode criar rolagem lateral no celular (clip não quebra o header "sticky") */
  html,body{overflow-x:clip;max-width:100%;}
  img{max-width:100%;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* ── ADDRESS BAR ── */
  .address-bar{background:var(--navy);color:#fff;padding:10px 20px;font-size:.95rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;text-align:center;}
  .address-bar a{color:#fff;text-decoration:none;opacity:.9;}.address-bar a:hover{opacity:1;}.address-bar span{opacity:.4;}

  /* ── HEADER ── */
  header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .header-top{max-width:1100px;margin:0 auto;padding:0 20px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
  .logo-mark{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:500;color:#fff;font-size:.85rem;}
  .logo-text{font-weight:700;font-size:1.1rem;color:var(--text);line-height:1.1;}
  .logo-sub{font-size:.76rem;color:var(--muted);font-weight:400;letter-spacing:.04em;}
  .nav-links{display:flex;align-items:center;gap:24px;}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;transition:color .15s;}
  .nav-links a:hover{color:var(--accent);}
  .nav-links a.active{color:var(--text);font-weight:700;}
  .ajuda-btn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;transition:color .15s;flex-shrink:0;}
  .ajuda-btn:hover{color:var(--accent);}
  .wa-btn-header{display:flex;align-items:center;gap:7px;background:var(--wa);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.88rem;text-decoration:none;transition:opacity .15s;flex-shrink:0;}
  .wa-btn-header:hover{opacity:.88;}
  .cart-btn{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;flex-shrink:0;transition:border-color .15s;color:var(--text);}
  .cart-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cart-count{position:absolute;top:-6px;right:-6px;background:var(--promo);color:#fff;font-size:.65rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}

  /* ── CATBAR ── */
  .catbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;}
  .catbar-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:8px;}
  .catbar-item{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;text-decoration:none;color:var(--text);font-size:.92rem;font-weight:600;border:1.5px solid var(--border);border-radius:10px;background:var(--accent-l);transition:border-color .15s,background .15s;white-space:nowrap;}
  .catbar-item:hover{border-color:var(--accent);background:#d6edf4;}
  .catbar-item svg{flex-shrink:0;stroke:var(--accent);}
  .catbar-all{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;text-decoration:none;color:var(--muted);font-size:.88rem;font-weight:600;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .15s,color .15s;white-space:nowrap;}
  .catbar-all:hover{border-color:var(--accent);color:var(--accent);}

  /* ── SEARCH BAR ROW ── */
  .search-bar-row{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 0;}
  .search-bar-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:12px;align-items:center;}
  .search-bar-inner .header-search{flex:1;max-width:none;}
  .header-search{flex:1;max-width:520px;position:relative;}
  .header-search input{width:100%;padding:12px 52px 12px 22px;border:1.5px solid var(--border);border-radius:30px;background:var(--bg);font-family:inherit;font-size:.95rem;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;}
  .header-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,153,.15);}
  .header-search input::placeholder{color:var(--muted);}
  .header-search-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:var(--accent);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s;}
  .header-search-btn:hover{opacity:.88;}
  .header-search-results{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:200;}
  .btn-foto{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--wa);color:var(--wa);padding:13px 18px;border-radius:10px;font-weight:700;font-size:.88rem;text-decoration:none;white-space:nowrap;transition:background .15s;flex-shrink:0;}
  .btn-foto:hover{background:var(--green-l);}

  /* ── WA FLOAT ── */
  .wa-float{position:fixed;bottom:24px;right:24px;display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;padding:13px 22px;border-radius:50px;font-weight:700;font-size:.95rem;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.35);transition:transform .15s;z-index:200;}
  .wa-float:hover{transform:translateY(-2px);}

  /* ── FOOTER ── */
  footer{border-top:1px solid var(--border);background:var(--surface);}
  .footer-main{max-width:1100px;margin:0 auto;padding:40px 20px 24px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:32px;}
  .footer-col-title{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
  .footer-brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .footer-contact-item{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .footer-contact-icon{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;}
  .footer-contact-val{font-size:.88rem;font-weight:500;color:var(--text);}
  .footer-contact-val a{color:var(--text);text-decoration:none;}.footer-contact-val a:hover{color:var(--accent);}
  .footer-hours{font-size:.85rem;color:var(--muted);line-height:1.8;}
  .footer-payments{border-top:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:20px;justify-content:center;flex-wrap:wrap;}
  .footer-payments-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .footer-payments-icons{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .pay-icon{width:54px;height:34px;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.08));}
  .pay-icon svg{width:100%;height:100%;}
  .footer-bottom{border-top:1px solid var(--border);padding:14px 20px;text-align:center;font-size:.78rem;color:var(--muted);}


  /* ══ SHAPKA ESCURA (azul-marinho) ══
     header + barra de categorias + busca formam um bloco só.
     "html body" dá prioridade sobre os estilos de cada página. */
  html body .address-bar{background:#071a33;font-size:.85rem;padding:7px 20px;}
  html body header{background:var(--navy);border-bottom:none;box-shadow:0 2px 12px rgba(11,37,69,.25);}
  html body .logo-text{color:#fff;}
  html body .logo-sub{color:#9fc3d6;}
  html body .nav-links a{color:#c9dbe6;}
  html body .nav-links a:hover{color:#fff;}
  html body .nav-links a.active{color:#fff;}
  html body .ajuda-btn{color:#c9dbe6;}
  html body .ajuda-btn:hover{color:#fff;}
  html body .cart-btn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff;}
  html body .cart-btn:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08);}
  html body .cart-count{background:var(--promo);color:#fff;}

  html body .catbar{background:var(--navy);border-bottom:none;border-top:1px solid rgba(255,255,255,.12);padding:8px 0 10px;}
  html body .catbar::after{background:linear-gradient(to right,transparent,var(--navy));}
  html body .catbar-item{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;font-weight:600;}
  html body .catbar-item svg{stroke:#9fe0f2;}
  html body .catbar-item:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff;}
  html body .catbar-item:hover svg{stroke:#fff;}
  html body .catbar-all{background:transparent;border:1px solid rgba(255,255,255,.25);color:#c9dbe6;border-radius:999px;}
  html body .catbar-all:hover{color:#fff;border-color:#fff;}

  html body .search-bar-row{background:var(--navy);border-bottom:none;padding:4px 0 16px;}
  html body .header-search input{background:#fff;border:none;border-radius:12px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.15);}
  html body .header-search input:focus{box-shadow:0 0 0 3px rgba(159,224,242,.55);}
  html body .header-search-btn{background:var(--accent);border-radius:9px;}
  html body .btn-foto{background:transparent;border-color:rgba(37,211,102,.7);color:#7ee2a8;}
  html body .btn-foto:hover{background:rgba(37,211,102,.12);}

  /* ── "Continuar comprando" na gaveta do carrinho ── */
  .cart-continue-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;margin:0 0 8px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;}
  .cart-continue-btn:hover{background:var(--accent-l);}

  /* ── BARRA DO CARRINHO (celular) ── */
  .cart-bar{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:250;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(11,37,69,.35);text-decoration:none;font-weight:700;font-size:.95rem;}
  .cart-bar b{font-family:'DM Mono',monospace;}
  .cart-bar .go{background:var(--promo);padding:9px 14px;border-radius:10px;white-space:nowrap;}
  @media(max-width:700px){ .cart-bar.show{display:flex;} body.has-cart-bar .wa-float{bottom:84px;} body.has-cart-bar{padding-bottom:76px;} }
  /* no computador: "pílula" fixa no canto inferior esquerdo (o WhatsApp fica à direita) */
  @media(min-width:701px){ .cart-bar.show{display:flex;left:24px;right:auto;bottom:24px;gap:16px;padding:10px 12px 10px 18px;} }

  /* ── RESPONSIVE ── */
  @media(max-width:380px){
    html body .header-top{gap:8px;padding:0 12px;}
    html body .logo img{height:36px!important;}
    html body .logo-text{font-size:.92rem;}
    html body .cart-btn{width:36px;height:36px;}
    html body .wa-btn-header{padding:8px 10px;}
    html body .ajuda-btn{display:none;}
  }
  @media(max-width:900px){.nav-links{display:none;}}
  @media(max-width:700px){
    .header-top{height:60px;padding:0 16px;gap:12px;}
    .logo-text{font-size:1rem;}
    .logo-sub{display:none;}
    .ajuda-btn span{display:none;}
    .wa-btn-header span{display:none;}
    .wa-btn-header{padding:9px 12px;}
    .address-bar{font-size:.78rem;gap:8px;padding:8px 16px;}
    .address-bar{row-gap:0;padding:2px 16px;} .address-bar a{display:inline-block;padding:7px 2px;}
    .ajuda-btn{min-width:40px;min-height:40px;justify-content:center;}
    .catbar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .catbar-inner{flex-wrap:nowrap;padding:0 16px;gap:6px;}
    .catbar-item{font-size:.82rem;padding:7px 12px;}
    .catbar-all{font-size:.8rem;padding:7px 12px;}
    .search-bar-row{padding:8px 0;}
    .search-bar-inner{padding:0 16px;}
    .wa-float span{display:none;}
    .wa-float{padding:14px;border-radius:50%;bottom:16px;right:16px;}
    .footer-main{grid-template-columns:1fr;gap:20px;padding:24px 16px;}
  }
  /* ── Celular com fonte grande (tamanho de texto do sistema / navegador do Instagram):
        nada pode empurrar a página para fora da tela ── */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  @media(max-width:600px){
    html,body{max-width:100%;overflow-x:clip;}
    html body .catbar-item,html body .catbar-all{overflow:hidden;text-overflow:ellipsis;}
    .btn-foto{white-space:normal;text-align:center;justify-content:center;flex-shrink:1;min-width:0;}
  }
  /* ── CATEGORIAS no celular: 5 botões numa linha, sem rolagem ── */
  .cb-s{display:none;}
  @media(max-width:600px){
    html body .catbar{overflow:visible;padding:8px 0 10px;}
    html body .catbar::after{display:none;}
    html body .catbar-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 12px;}
    html body .catbar-item,html body .catbar-all{flex-direction:column;justify-content:center;gap:4px;margin:0;min-width:0;padding:8px 2px;border-radius:12px;font-size:.7rem;line-height:1.1;white-space:nowrap;text-align:center;}
    html body .catbar-item svg{width:22px;height:22px;}
    html body .catbar-all svg{width:20px;height:20px;}
    .cb-l{display:none;} .cb-s{display:inline;}
  }
  @media(min-width:601px) and (max-width:1000px){
    html body .catbar{overflow:visible;}
    html body .catbar::after{display:none;}
    html body .catbar-inner{flex-wrap:wrap;}
  }
</style>
