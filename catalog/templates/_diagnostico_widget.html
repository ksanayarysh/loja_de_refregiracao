<style>
.mtf-diag{--diag-red:#e2144a;--diag-red-bg:#fdf2f5;--diag-red-dark:#b30d39;}
.mtf-diag *{box-sizing:border-box;}
.diag-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:28px 24px;margin:40px 0;}
.diag-wrap-inline{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:24px;margin:32px 0;}
.diag-head{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.diag-head-icon{width:38px;height:38px;border-radius:50%;background:var(--diag-red-bg,#fdf2f5);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.diag-head-text{font-size:1rem;font-weight:700;color:var(--text);}
.diag-head-sub{font-size:.82rem;color:var(--muted);margin-top:1px;}
.symptom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px;}
.symptom-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;display:flex;align-items:flex-start;gap:8px;font-family:inherit;}
.symptom-btn:hover{border-color:var(--accent);background:var(--diag-red-bg,#fdf2f5);}
.symptom-btn.active{border-color:var(--diag-red,#e2144a);background:var(--diag-red-bg,#fdf2f5);}
.symptom-icon{font-size:18px;flex-shrink:0;line-height:1.2;}
.symptom-label{font-size:.82rem;color:var(--text);line-height:1.35;font-weight:600;}
.symptom-device{font-size:.74rem;color:var(--muted);margin-top:2px;}
.custom-row{display:flex;gap:8px;margin-bottom:0;}
.custom-row input{flex:1;font-size:.9rem;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s;}
.custom-row input:focus{outline:none;border-color:var(--accent);}
.custom-row input::placeholder{color:var(--muted);}
.btn-diagnose{background:var(--diag-red,#e2144a);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s;font-family:inherit;display:flex;align-items:center;gap:6px;}
.btn-diagnose:hover{background:var(--diag-red-dark,#b30d39);}
.btn-diagnose:disabled{background:var(--border);color:var(--muted);cursor:default;}
.diag-result{margin-top:20px;display:none;}
.result-card{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;}
.result-hdr{background:var(--diag-red-bg,#fdf2f5);padding:11px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.result-hdr-title{font-size:.92rem;font-weight:700;color:var(--diag-red-dark,#b30d39);}
.result-body{padding:16px;}
.sec-label{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
.sec-label:first-child{margin-top:0;}
.cause-list{display:flex;flex-direction:column;gap:6px;}
.cause-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);}
.cause-item.alta{border-color:#e2144a44;background:var(--diag-red-bg,#fdf2f5);}
.cause-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.cause-dot.alta{background:var(--diag-red,#e2144a);}
.cause-dot.media{background:#f59e0b;}
.cause-dot.baixa{background:var(--muted);}
.cause-text{font-size:.85rem;color:var(--text);line-height:1.45;}
.cause-peca{font-size:.78rem;color:var(--diag-red,#e2144a);margin-top:3px;cursor:pointer;font-weight:600;}
.cause-peca:hover{text-decoration:underline;}
.check-list{display:flex;flex-direction:column;gap:5px;}
.check-item{display:flex;gap:7px;align-items:flex-start;font-size:.85rem;color:var(--text);line-height:1.4;}
.check-item-icon{color:#10b981;flex-shrink:0;font-size:14px;margin-top:2px;}
.tecnico-box{margin-top:14px;padding:11px 13px;background:#fff8e1;border:1px solid #f59e0b55;border-radius:10px;display:flex;gap:9px;align-items:flex-start;font-size:.83rem;color:var(--text);line-height:1.45;}
.tecnico-box strong{font-weight:700;color:#92400e;}
.alerta-box{margin-top:10px;padding:11px 13px;background:#fff0f0;border:1px solid #f8717133;border-radius:10px;display:flex;gap:9px;align-items:flex-start;font-size:.83rem;color:var(--text);line-height:1.45;}
.alerta-box strong{font-weight:700;color:#991b1b;}
.diag-loading{display:flex;align-items:center;gap:10px;padding:14px;font-size:.88rem;color:var(--muted);}
.diag-spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--diag-red,#e2144a);animation:diagspin .7s linear infinite;flex-shrink:0;}
@keyframes diagspin{to{transform:rotate(360deg);}}
.diag-reset-btn{margin-top:10px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-size:.8rem;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s;}
.diag-reset-btn:hover{background:var(--surface);}
.diag-cta-row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.diag-cta-wa{display:inline-flex;align-items:center;gap:7px;background:var(--wa,#25d366);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:.85rem;text-decoration:none;transition:opacity .15s;}
.diag-cta-wa:hover{opacity:.88;}
@media(max-width:520px){.symptom-grid{grid-template-columns:1fr 1fr;}.custom-row{flex-direction:column;}.btn-diagnose{width:100%;justify-content:center;}}
</style>

<div class="mtf-diag" id="mtf-diag-{{ widget_id|default('main') }}">
<div class="diag-wrap{% if inline is defined %}-inline{% endif %}">
  <div class="diag-head">
    <div class="diag-head-icon">🔍</div>
    <div>
      <div class="diag-head-text">Diagnóstico rápido</div>
      <div class="diag-head-sub">Selecione o sintoma ou descreva com suas palavras</div>
    </div>
  </div>

  <div class="symptom-grid">
    <button class="symptom-btn" data-id="gela-nao" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">🧊</span>
      <div><div class="symptom-label">Liga mas não gela</div><div class="symptom-device">Geladeira / freezer</div></div>
    </button>
    <button class="symptom-btn" data-id="gela-pouco" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">🌡️</span>
      <div><div class="symptom-label">Gela pouco</div><div class="symptom-device">Geladeira / bebedouro</div></div>
    </button>
    <button class="symptom-btn" data-id="faz-gelo-ar" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">❄️</span>
      <div><div class="symptom-label">Faz gelo / congela</div><div class="symptom-device">Ar-condicionado</div></div>
    </button>
    <button class="symptom-btn" data-id="ar-nao-gela" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">💨</span>
      <div><div class="symptom-label">Sopra quente / não gela</div><div class="symptom-device">Ar-condicionado</div></div>
    </button>
    <button class="symptom-btn" data-id="nao-liga" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">⚡</span>
      <div><div class="symptom-label">Não liga / sem energia</div><div class="symptom-device">Qualquer aparelho</div></div>
    </button>
    <button class="symptom-btn" data-id="barulho" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">🔊</span>
      <div><div class="symptom-label">Barulho / vibração</div><div class="symptom-device">Geladeira / ar-cond.</div></div>
    </button>
    <button class="symptom-btn" data-id="chuveiro" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">🚿</span>
      <div><div class="symptom-label">Chuveiro não esquenta</div><div class="symptom-device">Chuveiro elétrico</div></div>
    </button>
    <button class="symptom-btn" data-id="vazamento" onclick="mtfDiagSelect(this,'{{ widget_id|default('main') }}')">
      <span class="symptom-icon">💧</span>
      <div><div class="symptom-label">Vazamento de água</div><div class="symptom-device">Geladeira / ar-cond.</div></div>
    </button>
  </div>

  <div class="custom-row">
    <input type="text" id="diag-input-{{ widget_id|default('main') }}"
           placeholder="Ou descreva: ex. geladeira faz barulho alto à noite…"
           oninput="mtfDiagInput('{{ widget_id|default('main') }}')" />
    <button class="btn-diagnose" id="diag-btn-{{ widget_id|default('main') }}"
            onclick="mtfDiagRun('{{ widget_id|default('main') }}')" disabled>
      🔍 Diagnosticar
    </button>
  </div>

  <div class="diag-result" id="diag-result-{{ widget_id|default('main') }}">
    <div class="result-card">
      <div class="result-hdr">
        <span>📋</span>
        <span class="result-hdr-title" id="diag-rtitle-{{ widget_id|default('main') }}">Analisando…</span>
      </div>
      <div class="result-body" id="diag-rbody-{{ widget_id|default('main') }}"></div>
    </div>
    <button class="diag-reset-btn" onclick="mtfDiagReset('{{ widget_id|default('main') }}')">↩ Novo diagnóstico</button>
  </div>
</div>
</div>

<script>
(function(){
  const SYMPTOMS = {
    'gela-nao':'Geladeira ou freezer liga mas não gela',
    'gela-pouco':'Aparelho gela pouco (geladeira ou bebedouro)',
    'faz-gelo-ar':'Ar-condicionado forma gelo na serpentina',
    'ar-nao-gela':'Ar-condicionado sopra quente ou não gela',
    'nao-liga':'Aparelho não liga, sem resposta elétrica',
    'barulho':'Barulho alto ou vibração no aparelho',
    'chuveiro':'Chuveiro elétrico não aquece a água',
    'vazamento':'Aparelho vaza água'
  };

  window.mtfDiagSelect = function(btn, wid){
    const container = document.getElementById('mtf-diag-'+wid);
    container.querySelectorAll('.symptom-btn').forEach(b=>b.classList.remove('active'));
    const id = btn.dataset.id;
    btn.classList.add('active');
    const inp = document.getElementById('diag-input-'+wid);
    inp.value = SYMPTOMS[id] || '';
    document.getElementById('diag-btn-'+wid).disabled = false;
  };

  window.mtfDiagInput = function(wid){
    const val = document.getElementById('diag-input-'+wid).value.trim();
    document.getElementById('diag-btn-'+wid).disabled = !val;
    if(val){
      const container = document.getElementById('mtf-diag-'+wid);
      container.querySelectorAll('.symptom-btn').forEach(b=>{
        if(SYMPTOMS[b.dataset.id] !== val) b.classList.remove('active');
      });
    }
  };

  window.mtfDiagReset = function(wid){
    document.getElementById('diag-result-'+wid).style.display='none';
    document.getElementById('diag-input-'+wid).value='';
    document.getElementById('diag-btn-'+wid).disabled=true;
    const container = document.getElementById('mtf-diag-'+wid);
    container.querySelectorAll('.symptom-btn').forEach(b=>b.classList.remove('active'));
  };

  window.mtfDiagRun = async function(wid){
    const symptom = document.getElementById('diag-input-'+wid).value.trim();
    if(!symptom) return;
    const resultEl = document.getElementById('diag-result-'+wid);
    const bodyEl = document.getElementById('diag-rbody-'+wid);
    const titleEl = document.getElementById('diag-rtitle-'+wid);
    resultEl.style.display='block';
    titleEl.textContent='Analisando…';
    bodyEl.innerHTML='<div class="diag-loading"><div class="diag-spinner"></div>Identificando causas prováveis…</div>';
    document.getElementById('diag-btn-'+wid).disabled=true;
    try{
      const resp = await fetch('/api/diagnostico',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symptom})
      });
      const r = await resp.json();
      titleEl.textContent = r.titulo||'Diagnóstico';
      const dotCls = {alta:'alta',media:'media',baixa:'baixa'};
      const causasHtml = (r.causas||[]).map(c=>`
        <div class="cause-item ${c.probabilidade==='alta'?'alta':''}">
          <div class="cause-dot ${dotCls[c.probabilidade]||'baixa'}"></div>
          <div>
            <div class="cause-text">${c.descricao}</div>
            ${c.peca?`<div class="cause-peca" onclick="window.location='/category/'+encodeURIComponent('${c.peca.toLowerCase().replace(/\s+/g,'-')}')">🔧 ${c.peca} — ver na loja →</div>`:''}
          </div>
        </div>`).join('');
      const verificarHtml = (r.cliente_pode_verificar||[]).map(v=>
        `<div class="check-item"><span class="check-item-icon">✓</span><span>${v}</span></div>`
      ).join('');
      const alertaHtml = r.alerta?`<div class="alerta-box"><span>⚠️</span><div><strong>Atenção:</strong> ${r.alerta}</div></div>`:'';
      const waMsg = encodeURIComponent(`Olá! Usei o diagnóstico online: "${symptom}". Podem me ajudar?`);
      bodyEl.innerHTML=`
        <div class="sec-label">Causas prováveis</div>
        <div class="cause-list">${causasHtml}</div>
        ${verificarHtml?`<div class="sec-label">O que verificar antes de chamar o técnico</div><div class="check-list">${verificarHtml}</div>`:''}
        <div class="tecnico-box"><span>🔧</span><div><strong>Quando chamar técnico:</strong> ${r.precisa_tecnico||'Consulte nosso técnico para avaliação presencial.'}</div></div>
        ${alertaHtml}
        <div class="diag-cta-row">
          <a class="diag-cta-wa wa-track" href="https://wa.me/{{ wa_number }}?text=${waMsg}" target="_blank" rel="noopener" data-product="Diagnóstico IA">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.853L.057 23.854a.5.5 0 0 0 .609.61l6.084-1.506A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a10 10 0 0 1-5.195-1.452l-.372-.22-3.862.955.984-3.78-.243-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
            Falar com a loja
          </a>
        </div>`;
    }catch(e){
      titleEl.textContent='Erro';
      bodyEl.innerHTML='<div style="padding:12px;font-size:.85rem;color:var(--muted)">Não foi possível processar. Tente novamente ou fale conosco pelo WhatsApp.</div>';
      document.getElementById('diag-btn-'+wid).disabled=false;
    }
  };
})();
</script>
