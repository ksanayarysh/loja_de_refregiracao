<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar Pedido — M.T.F</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: bisque; min-height: 100vh; }

    .navbar { background: bisque; padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #ccc; gap: 20px; flex-wrap: wrap; }
    .nav-brand { font-weight: 900; font-size: 1.1rem; color: #111; text-decoration: none; }
    .navbar a { color: #E2144A; text-decoration: none; font-weight: 700; font-size: .95rem; }
    .navbar a:hover { text-decoration: underline; }

    .layout { display: flex; min-height: calc(100vh - 50px); }
    .sidebar { width: 160px; flex-shrink: 0; border-right: 1px solid #ccc; padding: 16px 0; background: bisque; }
    .sidebar ul { list-style: none; }
    .sidebar ul li { position: relative; }
    .sidebar ul li a { display: block; text-decoration: none; color: #E2144A; background: #fff; padding: 7px 10px; border: 1px solid #ccc; border-left: none; font-size: .9rem; }
    .sidebar ul li a:hover { background: #ccc; font-weight: bold; }
    .sidebar .submenu { display: none; position: absolute; left: 149px; top: 0; width: 150px; z-index: 10; }
    .sidebar ul li:hover .submenu { display: block; }

    .content { flex: 1; padding: 24px; }

    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08); padding: 24px; max-width: 700px; }

    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #111; }

    /* CART TABLE */
    .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .cart-table th { background: bisque; font-weight: 900; padding: 10px; text-align: left; font-size: .9rem; border-bottom: 2px solid #ccc; }
    .cart-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: .9rem; vertical-align: middle; }
    .cart-table .price { font-weight: 900; white-space: nowrap; }

    .qty-input { width: 70px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: .9rem; text-align: center; font-family: inherit; }
    .remove-btn { background: none; border: none; color: #E2144A; cursor: pointer; font-size: 1rem; padding: 2px 6px; }
    .remove-btn:hover { color: #dc2626; }

    .subtotal-cell { font-weight: 900; color: #111; white-space: nowrap; }

    /* TOTAL */
    .total-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 2px solid #111; margin-bottom: 20px; }
    .total-label { font-size: 1.1rem; font-weight: 900; }
    .total-value { font-size: 1.4rem; font-weight: 900; color: #E2144A; }

    /* PAYMENT */
    label { display: block; font-weight: 900; margin: 14px 0 6px; color: #111; }
    select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d6d9e0; font-size: 1rem; font-family: inherit; background: #fff; }
    select:focus { outline: none; border-color: #007bff; }

    /* DATE */
    input[type="date"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d6d9e0; font-size: 1rem; font-family: inherit; background: #fff; }

    /* BTNS */
    .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn-primary { padding: 14px 24px; border-radius: 10px; border: none; background: #111827; color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { background: #374151; }
    .btn-secondary { padding: 14px 24px; border-radius: 10px; border: 1px solid #ccc; background: #fff; color: #E2144A; font-weight: 900; font-size: 1rem; text-decoration: none; display: inline-block; }
    .btn-secondary:hover { background: #ccc; }
    .btn-wa { padding: 14px 24px; border-radius: 10px; border: none; background: #25d366; color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn-wa:hover { background: #1ebe5d; }

    .empty-msg { text-align: center; padding: 40px 0; color: #888; }
    .empty-msg a { color: #E2144A; font-weight: 700; }


    /* TROCO */
    .troco-block { margin-top: 16px; padding: 16px; background: #f9f9f9; border-radius: 10px; border: 1px solid #e5e7eb; display: block; }
    .troco-block label { margin-top: 0; margin-bottom: 6px; }
    .troco-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d6d9e0; font-size: 1rem; font-family: inherit; background: #fff; }
    .troco-input:focus { outline: none; border-color: #007bff; }
    .troco-result { margin-top: 10px; font-size: 1.1rem; font-weight: 900; display: none; }
    .troco-result.ok  { color: #166534; }
    .troco-result.err { color: #dc2626; }
    .saldo-block { margin-top: 8px; padding: 14px; background: #f0fdf4; border-radius: 10px; border: 1px solid #bbf7d0; display: none; }
    .saldo-block label { margin-top: 0; color: #166534; }
    .saldo-balance { margin-top: 8px; font-size: 1.05rem; font-weight: 900; display: none; }
    .saldo-ok  { color: #166534; }
    .saldo-err { color: #dc2626; }
    .client-search-wrap { position: relative; }
    .client-results { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #d6d9e0; border-radius: 10px; z-index: 50; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .client-item { padding: 10px 14px; cursor: pointer; font-size: .9rem; border-bottom: 1px solid #f3f4f6; }
    .client-item:last-child { border-bottom: none; }
    .client-item:hover { background: #f0fdf4; }
    @media (max-width: 600px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ccc; }
    }
  </style>
</head>
<body>

<header class="navbar">
  <a href="/" class="nav-brand">🛍 M.T.F</a>
  <a href="/">Início</a>
  <a href="/products">Produtos</a>
  <a href="/sales">Vendas</a>
  <a href="/sales/new">+ Venda</a>
  <a href="/calc">Calculadora</a>
</header>

<div class="layout">
  <nav class="sidebar">
    <ul>
      <li><a href="/">Início</a></li>
      <li>
        <a href="#">Produtos ▸</a>
        <ul class="submenu">
          <li><a href="/products">Lista</a></li>
          <li><a href="/products/new">+ Cadastrar</a></li>
        </ul>
      </li>
      <li>
        <a href="#">Vendas ▸</a>
        <ul class="submenu">
          <li><a href="/sales">Lista</a></li>
          <li><a href="/sales/new">+ Nova</a></li>
        </ul>
      </li>
      <li><a href="/calc">Calculadora</a></li>
    </ul>
  </nav>

  <main class="content">
    <div class="card">
      <h1>🛒 Finalizar Pedido</h1>

      <div id="empty-msg" class="empty-msg" style="display:none">
        <p>O carrinho está vazio.</p>
        <a href="/">← Voltar</a>
      </div>

      <div id="checkout-content">
        <table class="cart-table" id="cart-table">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço unit.</th>
              <th>Qtd</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-tbody"></tbody>
        </table>

        <div class="total-row">
          <span class="total-label">Total:</span>
          <span class="total-value" id="total-display">R$ 0,00</span>
        </div>

        <!-- Hidden form submitted to backend -->
        <form id="checkout-form" method="post" action="/sales/checkout">
          <input type="hidden" name="items_json" id="items-json">

          <label for="sold_at">Data da venda</label>
          <input type="date" id="sold_at" name="sold_at" required>

          <label for="payment_type">Forma de pagamento</label>
          <select id="payment_type" name="payment_type" required>
            <option value="dinheiro">💵 Dinheiro</option>
            <option value="pix">📱 Pix</option>
            <option value="cartao_credito">💳 Cartão de crédito</option>
            <option value="cartao_debito">💳 Cartão de débito</option>
            <option value="saldo">💰 Saldo do cliente</option>
          </select>

          <!-- Saldo block -->
          <div class="saldo-block" id="saldo-block">
            <input type="hidden" id="client_id" name="client_id" value="">
            <label>Cliente</label>
            <div class="client-search-wrap">
              <input type="text" id="client-search" placeholder="Digite o nome do cliente..." autocomplete="off" oninput="searchClients(this.value)">
              <div class="client-results" id="client-results"></div>
            </div>
            <div class="saldo-balance" id="saldo-balance"></div>
          </div>

          <!-- Troco (só dinheiro) -->
          <div class="troco-block" id="troco-block">
            <label for="valor-pago">💵 Valor recebido (R$)</label>
            <input class="troco-input" type="number" id="valor-pago" min="0" step="0.01"
                   placeholder="Ex.: 50,00" oninput="calcTroco()">
            <div class="troco-result" id="troco-result"></div>
          </div>

          <div class="btns">
            <button class="btn-primary" type="button" onclick="submitCheckout()">✅ Confirmar vendas</button>
            <button class="btn-wa" type="button" onclick="shareOrcamento()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.853L.057 23.854a.5.5 0 0 0 .609.61l6.084-1.506A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a10 10 0 0 1-5.195-1.452l-.372-.22-3.862.955.984-3.78-.243-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
              Compartilhar orçamento
            </button>
            <a class="btn-secondary" href="/" onclick="void(0)">← Voltar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem('mtf_cart') || '[]');

  document.getElementById('sold_at').value = new Date().toISOString().split('T')[0];

  const WA_NUMBER = '{{ wa_number }}';

  function saveCart() { localStorage.setItem('mtf_cart', JSON.stringify(cart)); }

  function fmt(n) { return 'R$ ' + parseFloat(n).toFixed(2).replace('.', ','); }

  function renderCart() {
    const tbody = document.getElementById('cart-tbody');
    if (!cart.length) {
      document.getElementById('checkout-content').style.display = 'none';
      document.getElementById('empty-msg').style.display = 'block';
      return;
    }
    tbody.innerHTML = cart.map((item, idx) => `
      <tr id="row-${idx}">
        <td><strong>${item.name}</strong><br><small style="color:#888">${item.unit}</small></td>
        <td class="price">${fmt(item.price)}</td>
        <td>
          <input class="qty-input" type="number" value="${item.qty}" min="0.001" step="any"
            onchange="updateQty(${idx}, this.value)">
        </td>
        <td class="subtotal-cell" id="sub-${idx}">${fmt(item.price * item.qty)}</td>
        <td><button class="remove-btn" onclick="removeItem(${idx})">🗑</button></td>
      </tr>
    `).join('');
    updateTotal();
  }

  function updateQty(idx, val) {
    const qty = Math.max(0.001, parseFloat(val) || 0.001);
    cart[idx].qty = qty;
    saveCart();
    document.getElementById(`sub-${idx}`).textContent = fmt(cart[idx].price * qty);
    updateTotal();
  }

  function removeItem(idx) {
    cart.splice(idx, 1);
    saveCart();
    renderCart();
  }

  function updateTotal() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('total-display').textContent = fmt(total);
  }

  function submitCheckout() {
    if (!cart.length) { alert('Carrinho vazio!'); return; }
    for (const item of cart) {
      if (!item.qty || item.qty <= 0) {
        alert(`Quantidade inválida para ${item.name}`);
        return;
      }
    }
    const clientId = document.getElementById('client_id').value;
    if (document.getElementById('payment_type').value === 'saldo' && !clientId) {
      alert('Selecione um cliente para pagamento por saldo!'); return;
    }
    document.getElementById('items-json').value = JSON.stringify(cart.map(i => ({
      product_id: i.id,
      qty: i.qty,
      unit_price: i.price,
      total: parseFloat((i.price * i.qty).toFixed(2))
    })));
    document.getElementById('checkout-form').submit();
  }

  function shareOrcamento() {
    if (!cart.length) { alert('Carrinho vazio!'); return; }
    const lines = cart.map(i =>
      `• ${i.name} (${i.unit}) × ${i.qty} = R$ ${(i.price * i.qty).toFixed(2).replace('.', ',')}`
    );
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const msg = `Olá! Segue o orçamento:\n\n${lines.join('\n')}\n\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*\n\nPodemos confirmar?`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  function autoFillTroco() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const rounded = Math.ceil(total / 5) * 5;
    document.getElementById('valor-pago').value = rounded.toFixed(2);
    calcTroco();
  }

  function calcTroco() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const pago  = parseFloat(document.getElementById('valor-pago').value) || 0;
    const el    = document.getElementById('troco-result');
    if (!pago) { el.style.display = 'none'; return; }
    const troco = pago - total;
    el.style.display = 'block';
    if (troco < 0) {
      el.className = 'troco-result err';
      el.textContent = '⚠️ Falta R$ ' + Math.abs(troco).toFixed(2).replace('.', ',');
    } else {
      el.className = 'troco-result ok';
      el.textContent = '✅ Troco: R$ ' + troco.toFixed(2).replace('.', ',');
    }
  }

  document.getElementById('payment_type').addEventListener('change', function() {
    document.getElementById('troco-block').style.display = this.value === 'dinheiro' ? 'block' : 'none';
    document.getElementById('saldo-block').style.display = this.value === 'saldo' ? 'block' : 'none';
    if (this.value !== 'saldo') { document.getElementById('client_id').value = ''; document.getElementById('saldo-balance').style.display = 'none'; }
  });

  let allClients = [];
  fetch('/api/clients').then(r => r.json()).then(data => { allClients = data; }).catch(() => {});

  function searchClients(q) {
    const box = document.getElementById('client-results');
    document.getElementById('client_id').value = '';
    document.getElementById('saldo-balance').style.display = 'none';
    if (!q || q.length < 1) { box.style.display = 'none'; return; }
    const filtered = allClients.filter(c => c.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
    if (!filtered.length) { box.innerHTML = '<div class="client-item" style="color:#888">Nenhum cliente encontrado</div>'; box.style.display = 'block'; return; }
    box.innerHTML = filtered.map(c =>
      `<div class="client-item" onclick="selectClient(${c.id}, '${c.name.replace(/'/g,"\'")}', ${c.balance})">
        ${c.name} <span style="color:#888;font-size:.85rem">— R$ ${parseFloat(c.balance).toFixed(2).replace('.',',')}</span>
      </div>`
    ).join('');
    box.style.display = 'block';
  }

  function selectClient(id, name, balance) {
    document.getElementById('client_id').value = id;
    document.getElementById('client-search').value = name;
    document.getElementById('client-results').style.display = 'none';
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const bal = document.getElementById('saldo-balance');
    bal.style.display = 'block';
    const balNum = parseFloat(balance);
    if (balNum > 0 && balNum >= total) {
      bal.className = 'saldo-balance saldo-ok';
      bal.textContent = '✅ Saldo: R$ ' + balNum.toFixed(2).replace('.',',');
    } else if (balNum <= 0) {
      bal.className = 'saldo-balance saldo-err';
      bal.textContent = '⚠️ Crédito (fiado) — saldo: R$ ' + balNum.toFixed(2).replace('.',',');
    } else {
      bal.className = 'saldo-balance saldo-err';
      bal.textContent = '⚠️ Saldo parcial: R$ ' + balNum.toFixed(2).replace('.',',') + ' (ficará negativo)';
    }
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.client-search-wrap')) document.getElementById('client-results').style.display = 'none';
  });

  renderCart();
</script>
</body>
</html>
