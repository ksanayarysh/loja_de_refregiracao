<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo Cliente — M.T.F</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:bisque;min-height:100vh}
    .navbar{background:bisque;padding:10px 16px;display:flex;align-items:center;border-bottom:1px solid #ccc;gap:20px;flex-wrap:wrap}
    .nav-brand{font-weight:900;font-size:1.1rem;color:#111;text-decoration:none}
    .navbar a{color:#E2144A;text-decoration:none;font-weight:700;font-size:.95rem}
    .navbar a.active{color:#111;font-weight:900}
    .layout{display:flex;min-height:calc(100vh - 50px)}
    .sidebar{width:160px;flex-shrink:0;border-right:1px solid #ccc;padding:16px 0;background:bisque}
    .sidebar ul{list-style:none}
    .sidebar ul li{position:relative}
    .sidebar ul li a{display:block;text-decoration:none;color:#E2144A;background:#fff;padding:7px 10px;border:1px solid #ccc;border-left:none;font-size:.9rem}
    .sidebar ul li a:hover{background:#ccc;font-weight:bold}
    .sidebar .submenu{display:none;position:absolute;left:149px;top:0;width:150px;z-index:10}
    .sidebar ul li:hover .submenu{display:block}
    .content{flex:1;padding:24px}
    .card{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:24px;max-width:520px}
    h1{font-size:1.5rem;margin-bottom:20px;color:#111}
    label{display:block;font-weight:900;margin:14px 0 6px;color:#111}
    input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d6d9e0;font-size:1rem;font-family:inherit;background:#fff}
    textarea{min-height:80px;resize:vertical}
    input:focus,textarea:focus{outline:none;border-color:#007bff}
    .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    .btn-primary{padding:12px 20px;border-radius:10px;border:none;background:#111827;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}
    .btn-primary:hover{background:#374151}
    .btn-secondary{padding:12px 20px;border-radius:10px;border:1px solid #ccc;background:#fff;color:#E2144A;font-weight:900;font-size:1rem;text-decoration:none;display:inline-block}
    .error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:800}
    @media(max-width:600px){.layout{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid #ccc}}
  </style>
</head>
<body>
<header class="navbar">
  <a href="/" class="nav-brand">🛍 M.T.F</a>
  <a href="/products">Produtos</a>
  <a href="/sales">Vendas</a>
  <a href="/clients" class="active">Clientes</a>
  <a href="/calc">Calculadora</a>
</header>
<div class="layout">
  <nav class="sidebar">
    <ul>
      <li><a href="/">Início</a></li>
      <li><a href="#">Produtos ▸</a><ul class="submenu"><li><a href="/products">Lista</a></li><li><a href="/products/new">+ Cadastrar</a></li></ul></li>
      <li><a href="#">Vendas ▸</a><ul class="submenu"><li><a href="/sales">Lista</a></li><li><a href="/sales/new">+ Nova</a></li></ul></li>
      <li><a href="#">Clientes ▸</a><ul class="submenu"><li><a href="/clients">Lista</a></li><li><a href="/clients/new">+ Novo</a></li></ul></li>
      <li><a href="/calc">Calculadora</a></li>
    </ul>
  </nav>
  <main class="content">
    <div class="card">
      <h1>👤 Novo Cliente</h1>
      {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
      <form method="post" action="/clients/new">
        <label for="name">Nome *</label>
        <input id="name" name="name" type="text" required placeholder="Ex: João Silva">
        <label for="phone">Telefone / WhatsApp</label>
        <input id="phone" name="phone" type="text" placeholder="Ex: 21999990000">
        <label for="note">Observação</label>
        <textarea id="note" name="note" placeholder="Endereço, empresa, etc."></textarea>
        <div class="btns">
          <button class="btn-primary" type="submit">Salvar cliente</button>
          <a class="btn-secondary" href="/clients">Voltar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
