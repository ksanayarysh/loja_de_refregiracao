<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M.T.F Refrigeração</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: bisque;
      min-height: 100vh;
    }

    h1 {
      color: black;
      text-align: center;
      padding: 18px 0 10px;
      font-size: 1.8rem;
    }

    /* ── NAVBAR ── */
    .navbar {
      background-color: bisque;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 1px solid #ccc;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-container { display: flex; align-items: center; }

    .search-input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      outline: none;
      font-size: .95rem;
      width: 220px;
    }

    .search-button {
      padding: 8px 12px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: .95rem;
    }
    .search-button:hover { background-color: #0056b3; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 120px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 160px;
      flex-shrink: 0;
      border-right: 1px solid #ccc;
      padding: 16px 0;
      background: bisque;
    }

    .sidebar ul { list-style: none; padding: 0; margin: 0; width: 100%; }
    .sidebar ul li { position: relative; }

    .sidebar ul li a {
      display: block;
      text-decoration: none;
      color: #E2144A;
      background: #fff;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-left: none;
      font-size: .9rem;
    }
    .sidebar ul li a:hover { text-decoration: underline; font-weight: bold; background: #ccc; }

    .sidebar .submenu {
      display: none;
      position: absolute;
      left: 149px;
      top: 0;
      width: 150px;
      z-index: 10;
    }
    .sidebar ul li:hover .submenu { display: block; }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-x: auto;
    }

    /* ── QUICK LINKS ── */
    .quick-links { display: flex; gap: 10px; flex-wrap: wrap; }

    .quick-links a {
      padding: 10px 18px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-decoration: none;
      color: #E2144A;
      font-weight: bold;
      font-size: .9rem;
      transition: background .2s;
    }
    .quick-links a:hover { background: #ccc; }
    .quick-links a.primary { background: #007bff; color: #fff; border-color: #007bff; }
    .quick-links a.primary:hover { background: #0056b3; }

    /* ── SEARCH RESULTS ── */
    #search-results {
      display: none;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 12px;
      max-width: 500px;
    }
    #search-results.show { display: block; }
    #search-results h3 { font-size: .9rem; color: #555; margin-bottom: 10px; }

    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: .9rem;
    }
    .result-item:last-child { border-bottom: none; }
    .result-price { font-weight: bold; color: #007bff; }

    /* ── CALCULATOR (tabela de gás) ── */
    .calc-section h3 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: black;
    }

    .gas-table-wrap { overflow-x: auto; }

    table.gas-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 8px;
      table-layout: fixed;
    }

    .gas-table thead th {
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      vertical-align: top;
    }
    .gas-table thead th:hover { border-color: #007bff; }
    .gas-table thead th.selected {
      border-color: #007bff;
      border-width: 4px;
      background: #cfe2ff;
      box-shadow: 0 0 0 4px rgba(0,123,255,.18);
    }

    .gas-name { font-size: 1.2rem; font-weight: bold; color: #E2144A; margin-bottom: 4px; }
    .gas-price-label { font-size: .9rem; color: #333; }
    .gas-unit { font-size: .75rem; color: #888; }

    .gas-table tbody td {
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 12px 10px;
      vertical-align: top;
      transition: border-color .2s, background .2s;
      font-size: .9rem;
    }
    .gas-table tbody td.selected {
      border-color: #007bff;
      border-width: 3px;
      background: #e8f0ff;
    }

    .calc-label { display: block; font-size: .85rem; color: #333; margin-bottom: 4px; }

    .gas-table input[type="number"] {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 6px;
      margin-bottom: 8px;
      outline: none;
    }
    .gas-table input[type="number"]:focus { border-color: #007bff; }

    .calc-btn {
      width: 100%;
      padding: 9px;
      font-size: .9rem;
      font-weight: bold;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .calc-btn:hover { background: #1e7e34; }

    .resultado {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #e8f5e9;
      border: 2px solid #28a745;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      color: #1a6e2e;
      text-align: center;
    }
    .resultado.show { display: block; }
    .resultado small { display: block; font-size: .75rem; font-weight: normal; color: #555; margin-top: 3px; }
    .resultado.error { background: #fff3cd; border-color: #ffc107; color: #856404; }

    .cart-btn {
      width: 100%;
      padding: 9px;
      font-size: .9rem;
      font-weight: bold;
      background: #fff;
      color: #E2144A;
      border: 2px solid #E2144A;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      transition: background .2s, color .2s;
    }
    .cart-btn:hover { background: #E2144A; color: #fff; }

    .row-label {
      font-size: .9rem;
      font-weight: bold;
      color: #555;
      text-align: center;
      padding: 4px 0 0;
    }

    @media (max-width: 600px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ccc; }
      .sidebar .submenu { left: 0; top: 100%; }
    }
  </style>
</head>
<body>

<h1>M.T.F Refrigeração</h1>

<!-- NAVBAR -->
<header class="navbar">
  <div class="search-container">
    <input type="text" id="search-input" placeholder="pesquisar produto..." class="search-input">
    <button class="search-button" onclick="searchProducts()">pesquisar</button>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <ul>
      <li><a href="/">Início</a></li>
      <li>
        <a href="#">Produtos ▸</a>
        <ul class="submenu">
          <li><a href="/products">Lista</a></li>
          <li><a href="/products/new">+ Cadastrar</a></li>
        </ul>
      </li>
      <li>
        <a href="#">Vendas ▸</a>
        <ul class="submenu">
          <li><a href="/sales">Lista</a></li>
          <li><a href="/sales/new">+ Nova venda</a></li>
        </ul>
      </li>
      <li><a href="/calc">Calculadora</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main class="content">

    <!-- Quick links -->
    <div class="quick-links">
      <a href="/products/new" class="primary">+ Cadastrar produto</a>
      <a href="/sales/new" class="primary">+ Nova venda</a>
      <a href="/products">Lista de produtos</a>
      <a href="/sales">Lista de vendas</a>
    </div>

    <!-- Search results -->
    <div id="search-results">
      <h3>Resultados:</h3>
      <div id="results-list"></div>
    </div>

    <!-- Calculator -->
    <div class="calc-section">
      <h3>Calculadora de gás (kg)</h3>
      <div class="gas-table-wrap">
        <table class="gas-table" id="gas-table">
          <thead><tr id="header-row"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script>
  // ── GAS CALCULATOR ──
  let gases = [];

  async function loadGases() {
    try {
      const res = await fetch('/api/products?unit=kg');
      gases = await res.json();
    } catch { gases = []; }

    if (!gases.length) {
      document.getElementById('gas-table').innerHTML =
        '<tr><td style="color:#888;padding:12px">Nenhum produto em kg cadastrado.</td></tr>';
      return;
    }
    renderTable();
  }

  function renderTable() {
    const headerRow = document.getElementById('header-row');
    const tbody = document.getElementById('table-body');

    headerRow.innerHTML = gases.map((g, i) => `
      <th onclick="selectGas(${i})" id="th-${i}">
        <div class="gas-name">${g.name}</div>
        <div class="gas-price-label">R$ ${parseFloat(g.sale_price).toFixed(2)}</div>
        <div class="gas-unit">por kg</div>
      </th>
    `).join('');

    const labelRow1 = document.createElement('tr');
    labelRow1.innerHTML = `<td colspan="${gases.length}" class="row-label">📦 Gramas → R$</td>`;
    tbody.appendChild(labelRow1);

    const row1 = document.createElement('tr');
    gases.forEach((g, i) => {
      const td = document.createElement('td');
      td.id = `td-g-${i}`;
      td.innerHTML = `
        <span class="calc-label">Gramas:</span>
        <input type="number" id="input-g-${i}" min="0" step="any" placeholder="Ex: 500"
               onkeydown="if(event.key==='Enter') calcG(${i})">
        <button class="calc-btn" onclick="calcG(${i})">Calcular R$</button>
        <div class="resultado" id="res-g-${i}"></div>
        <button class="cart-btn" onclick="">🛒 Adicionar ao carrinho</button>
      `;
      row1.appendChild(td);
    });
    tbody.appendChild(row1);

    const labelRow2 = document.createElement('tr');
    labelRow2.innerHTML = `<td colspan="${gases.length}" class="row-label">💰 R$ → Gramas</td>`;
    tbody.appendChild(labelRow2);

    const row2 = document.createElement('tr');
    gases.forEach((g, i) => {
      const td = document.createElement('td');
      td.id = `td-r-${i}`;
      td.innerHTML = `
        <span class="calc-label">Valor em R$:</span>
        <input type="number" id="input-r-${i}" min="0" step="any" placeholder="Ex: 35,00"
               onkeydown="if(event.key==='Enter') calcR(${i})">
        <button class="calc-btn" onclick="calcR(${i})">Calcular gramas</button>
        <div class="resultado" id="res-r-${i}"></div>
        <button class="cart-btn" onclick="">🛒 Adicionar ao carrinho</button>
      `;
      row2.appendChild(td);
    });
    tbody.appendChild(row2);
  }

  function selectGas(idx) {
    gases.forEach((_, i) => {
      const sel = i === idx;
      document.getElementById(`th-${i}`).classList.toggle('selected', sel);
      document.getElementById(`td-g-${i}`).classList.toggle('selected', sel);
      document.getElementById(`td-r-${i}`).classList.toggle('selected', sel);
    });
  }

  function showResult(el, text, isError) {
    el.className = 'resultado show' + (isError ? ' error' : '');
    el.innerHTML = text;
  }

  function calcG(i) {
    const g = parseFloat(document.getElementById(`input-g-${i}`).value);
    const res = document.getElementById(`res-g-${i}`);
    const price = parseFloat(gases[i].sale_price);
    if (isNaN(g) || g <= 0) { showResult(res, 'Digite uma quantidade válida.', true); return; }
    showResult(res, `R$ ${(g * price / 1000).toFixed(2)}<small>${g}g de ${gases[i].name}</small>`, false);
    selectGas(i);
  }

  function calcR(i) {
    const r = parseFloat(document.getElementById(`input-r-${i}`).value);
    const res = document.getElementById(`res-r-${i}`);
    const price = parseFloat(gases[i].sale_price);
    if (isNaN(r) || r <= 0) { showResult(res, 'Digite um valor válido.', true); return; }
    showResult(res, `${(r / price * 1000).toFixed(1)} g<small>R$ ${r.toFixed(2)} de ${gases[i].name}</small>`, false);
    selectGas(i);
  }

  loadGases();

  // ── SEARCH ──
  async function searchProducts() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    const container = document.getElementById('search-results');
    const list = document.getElementById('results-list');
    list.innerHTML = '<div class="result-item" style="color:#888">Buscando...</div>';
    container.classList.add('show');
    try {
      const res = await fetch(`/api/products?search=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!data.length) {
        list.innerHTML = '<div class="result-item" style="color:#888">Nenhum produto encontrado.</div>';
        return;
      }
      list.innerHTML = data.map(p => `
        <div class="result-item">
          <span>${p.name} <span style="color:#aaa;font-size:.8rem">(${p.unit})</span></span>
          <span class="result-price">R$ ${parseFloat(p.sale_price).toFixed(2)}</span>
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<div class="result-item" style="color:red">Erro ao buscar.</div>';
    }
  }

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchProducts();
  });
</script>

</body>
</html>
