<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Gás</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: bisque;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 6px;
      color: black;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 28px;
      font-size: 1.1rem;
    }

    /* ── TABLE ── */
    .gas-table-wrap {
      overflow-x: auto;
    }

    table.gas-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 10px;
      table-layout: fixed;
    }

    /* Header row — gas name + price */
    .gas-table thead th {
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      vertical-align: top;
    }

    .gas-table thead th:hover { border-color: #007bff; }

    .gas-table thead th.selected {
      border-color: #007bff;
      background: #e8f0ff;
    }

    .gas-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #E2144A;
      margin-bottom: 6px;
    }

    .gas-price-label {
      font-size: 1rem;
      color: #333;
    }

    .gas-unit {
      font-size: .82rem;
      color: #888;
    }

    /* Body cells */
    .gas-table tbody td {
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 16px 12px;
      vertical-align: top;
      transition: border-color .2s, background .2s;
    }

    .gas-table tbody td.selected {
      border-color: #007bff;
      background: #f0f5ff;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: black;
    }

    .calc-label {
      display: block;
      font-size: .95rem;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 1.1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="number"]:focus { border-color: #007bff; }

    .calc-btn {
      width: 100%;
      padding: 11px;
      font-size: 1rem;
      font-weight: bold;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    .calc-btn:hover { background: #1e7e34; }

    .resultado {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #e8f5e9;
      border: 2px solid #28a745;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1a6e2e;
      text-align: center;
    }
    .resultado.show { display: block; }
    .resultado small {
      display: block;
      font-size: .8rem;
      font-weight: normal;
      color: #555;
      margin-top: 4px;
    }
    .resultado.error {
      background: #fff3cd;
      border-color: #ffc107;
      color: #856404;
    }

    /* Separator row label */
    .row-label {
      font-size: 1rem;
      font-weight: bold;
      color: #555;
      text-align: center;
      padding: 4px 0 0;
      letter-spacing: .03em;
    }

    @media (max-width: 600px) {
      .gas-name { font-size: 1.1rem; }
      input[type="number"] { font-size: 1rem; }
    }
  </style>
</head>
<body>

<h1>🧊 Calculadora de Gás</h1>
<p class="subtitle">Clique no gás para selecionar e use as calculadoras abaixo</p>

<div class="gas-table-wrap">
  <table class="gas-table" id="gas-table">
    <thead>
      <tr id="header-row">
        <!-- preenchido pelo JS -->
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- preenchido pelo JS -->
    </tbody>
  </table>
</div>

<script>
  let gases = [];
  let selectedIdx = null;

  async function loadGases() {
    try {
      const res = await fetch('/api/products?unit=kg');
      gases = await res.json();
    } catch {
      gases = [];
    }

    if (!gases.length) {
      document.getElementById('gas-table').innerHTML =
        '<tr><td style="text-align:center;color:#888;padding:20px">Nenhum produto em kg cadastrado.</td></tr>';
      return;
    }

    renderTable();
  }

  function renderTable() {
    const headerRow = document.getElementById('header-row');
    const tbody = document.getElementById('table-body');

    // ── Header: gas cards ──
    headerRow.innerHTML = gases.map((g, i) => `
      <th onclick="selectGas(${i})" id="th-${i}">
        <div class="gas-name">${g.name}</div>
        <div class="gas-price-label">R$ ${parseFloat(g.sale_price).toFixed(2)}</div>
        <div class="gas-unit">por kg</div>
      </th>
    `).join('');

    // ── Row 1: Gramas → R$ ──
    const row1 = document.createElement('tr');
    // label row
    const labelRow1 = document.createElement('tr');
    labelRow1.innerHTML = `<td colspan="${gases.length}" class="row-label">📦 Gramas → R$</td>`;
    tbody.appendChild(labelRow1);

    gases.forEach((g, i) => {
      const td = document.createElement('td');
      td.id = `td-g-${i}`;
      td.innerHTML = `
        <span class="calc-label">Gramas:</span>
        <input type="number" id="input-g-${i}" min="0" step="any" placeholder="Ex: 500"
               onkeydown="if(event.key==='Enter') calcG(${i})">
        <button class="calc-btn" onclick="calcG(${i})">Calcular R$</button>
        <div class="resultado" id="res-g-${i}"></div>
      `;
      row1.appendChild(td);
    });
    tbody.appendChild(row1);

    // ── Row 2: R$ → Gramas ──
    const labelRow2 = document.createElement('tr');
    labelRow2.innerHTML = `<td colspan="${gases.length}" class="row-label">💰 R$ → Gramas</td>`;
    tbody.appendChild(labelRow2);

    const row2 = document.createElement('tr');
    gases.forEach((g, i) => {
      const td = document.createElement('td');
      td.id = `td-r-${i}`;
      td.innerHTML = `
        <span class="calc-label">Valor em R$:</span>
        <input type="number" id="input-r-${i}" min="0" step="any" placeholder="Ex: 35,00"
               onkeydown="if(event.key==='Enter') calcR(${i})">
        <button class="calc-btn" onclick="calcR(${i})">Calcular gramas</button>
        <div class="resultado" id="res-r-${i}"></div>
      `;
      row2.appendChild(td);
    });
    tbody.appendChild(row2);
  }

  function selectGas(idx) {
    selectedIdx = idx;
    gases.forEach((_, i) => {
      const th = document.getElementById(`th-${i}`);
      const tdG = document.getElementById(`td-g-${i}`);
      const tdR = document.getElementById(`td-r-${i}`);
      if (i === idx) {
        th.classList.add('selected');
        tdG.classList.add('selected');
        tdR.classList.add('selected');
      } else {
        th.classList.remove('selected');
        tdG.classList.remove('selected');
        tdR.classList.remove('selected');
      }
    });
  }

  function showResult(el, text, isError) {
    el.className = 'resultado show' + (isError ? ' error' : '');
    el.innerHTML = text;
  }

  function calcG(i) {
    const g = parseFloat(document.getElementById(`input-g-${i}`).value);
    const res = document.getElementById(`res-g-${i}`);
    const price = parseFloat(gases[i].sale_price);
    if (isNaN(g) || g <= 0) {
      showResult(res, 'Digite uma quantidade válida.', true);
      return;
    }
    const total = (g * price / 1000).toFixed(2);
    showResult(res, `R$ ${total}<small>${g}g de ${gases[i].name}</small>`, false);
    selectGas(i);
  }

  function calcR(i) {
    const r = parseFloat(document.getElementById(`input-r-${i}`).value);
    const res = document.getElementById(`res-r-${i}`);
    const price = parseFloat(gases[i].sale_price);
    if (isNaN(r) || r <= 0) {
      showResult(res, 'Digite um valor válido.', true);
      return;
    }
    const grams = (r / price * 1000).toFixed(1);
    showResult(res, `${grams} g<small>R$ ${r.toFixed(2)} de ${gases[i].name}</small>`, false);
    selectGas(i);
  }

  loadGases();
</script>

</body>
</html>
